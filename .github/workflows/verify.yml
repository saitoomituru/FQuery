name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:origins
      - run: npm run validate:fixtures
      - run: npm run typecheck
      - run: npm test

  browser:
    name: Browser fixture (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright管理ChromiumをCIへ導入
        run: npx playwright install --with-deps chromium
      - name: fixture browser E2E
        run: npm run test:browser
      - name: browser失敗receiptを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-failure
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  proton-contract:
    name: Proton contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: saitoomituru/SphereOS-Atlantis
          ref: 4de928dec5196d458ace96432b2f9aac9c7cfabc
          path: .context/SphereOS-Atlantis
      - name: 固定Atlantis validatorでCore profileを検査
        working-directory: .context/SphereOS-Atlantis
        run: python3 -B -m atlantis_cli proton validate --document "$GITHUB_WORKSPACE/proton/FQueryCore.proton.md" --repo-root "$PWD" --json
      - name: 固定Atlantis validatorでPlugin profileを検査
        working-directory: .context/SphereOS-Atlantis
        run: python3 -B -m atlantis_cli proton validate --document "$GITHUB_WORKSPACE/proton/profiles/FQueryPlugin.proton.md" --repo-root "$PWD" --json
